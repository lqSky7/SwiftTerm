name: Release

# Publishing a GitHub release is the only trigger. The workflow file is read from the default
# branch, so a release built from a tag that predates this file still uses this one.
on:
  release:
    types: [published]

# `gh release upload` writes assets onto the release that fired the event.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag the release points at, not the default branch: a release must ship the code it
          # names. `github.ref` is `refs/tags/<tag>` for a release event.
          ref: ${{ github.ref }}

      - name: Build the app bundle
        run: ./Scripts/build-app.sh release --no-install

      - name: Package
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" app/Info.plist)
          ditto -c -k --keepParent dist/swiftTerm.app "swiftTerm-$VERSION.zip"
          shasum -a 256 "swiftTerm-$VERSION.zip" > "swiftTerm-$VERSION.zip.sha256"

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" swiftTerm-*.zip* --clobber
