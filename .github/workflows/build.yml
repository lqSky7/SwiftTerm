name: Build

# A compile check, so a broken build is found on the push that broke it rather than by whoever
# downloads the next release. `Release` builds the same thing on the same image — this is the same
# command, run earlier.
#
# **`[skip ci]` is not implemented here, and does not need to be.** GitHub skips a `push` or
# `pull_request` run by itself when the commit message carries `[skip ci]` — or `[ci skip]`,
# `[no ci]`, `[skip actions]`, `[actions skip]`. A docs-only or comment-only push can say so and
# cost nothing. `workflow_dispatch` ignores it: asking by hand is asking.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build the app bundle
        run: ./Scripts/build-app.sh release --no-install
